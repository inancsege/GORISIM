[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gorisim"
version = "0.2.0"
description = "Bidirectional Turkish Sign Language translator (Sign→Text and Speech→Sign)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Serhat Ege İnanç"}]
license = {text = "MIT"}
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pillow>=10.2",
  "pandas>=2.2",
  "yacs>=0.1.8",
  "natsort>=8.4",
  "pyannote.audio>=3.1.1",
  "speechbrain>=1.0",
  "faster-whisper>=1.0",
  "zeyrek>=0.1.3",
  "imageio-ffmpeg>=0.4.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "huggingface-hub>=0.22",
  "openai>=1.14",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "pyright>=1.1.350",
  "pre-commit>=3.6",
  "detect-secrets>=1.4",
]

[project.scripts]
gorisim-download = "gorisim.download:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gorisim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavy tests requiring downloaded models"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RET", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["src/gorisim"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
